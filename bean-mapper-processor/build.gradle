plugins {
    id 'buildlogic.java-library-conventions'
}

description = 'This project provides the annotation processor for bean mapper'

dependencies {
    implementation 'io.github.zeatul:hawk-core'
    implementation project(':bean-mapper-annotations')
    implementation 'io.github.zeatul:javapoet-pro'

    // Processor end-to-end testing
    testImplementation 'com.google.testing.compile:compile-testing'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// JDK 8 tools.jar for compile-testing (contains com.sun.source.util.TreeScanner)
// Resolve via Java Toolchains at configuration time, add to test classpath directly
def jdk8Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
}.get()
def javaHome = jdk8Launcher.metadata.javaHome.asFile.absolutePath
def toolsJarFile = new File(javaHome, 'lib/tools.jar')
if (toolsJarFile.exists()) {
    tasks.named('test') {
        classpath += files(toolsJarFile.absolutePath)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}