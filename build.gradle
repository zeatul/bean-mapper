import java.time.Duration

plugins {
    alias(libs.plugins.nmcp.aggregation)
}

nmcpAggregation {
    centralPortal {

        username = System.getenv("SONATYPE_USERNAME") ?: project.findProperty("sonatypeUsername")
        password = System.getenv("SONATYPE_PASSWORD") ?: project.findProperty("sonatypePassword")

        // 根据版本号自动区分
        def isRelease = !version.toString().endsWith("-SNAPSHOT")
        if (isRelease) {
            publishingType = "AUTOMATIC"
            validationTimeout = Duration.ofMinutes(30)
            publishingTimeout = Duration.ofMinutes(30)
        } else {
            publishingType = "AUTOMATIC"
            validationTimeout = Duration.ZERO
            publishingTimeout = Duration.ZERO
        }
    }


    publishAllProjectsProbablyBreakingProjectIsolation()
}


allprojects {
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 10, "minutes"
        resolutionStrategy.cacheDynamicVersionsFor 10, "minutes"
    }
}


tasks.register("tcp") {
    // Call publishAggregationToCentralPortal to publish the aggregation
    dependsOn("publishAggregationToCentralPortal")
    group = "publishing"
    description = "Shortcut for publishAggregationToCentralPortal"
}

tasks.register("tcps") {
    // Call publishAggregationToCentralPortalSnapshots to publish to the snapshots
    dependsOn("publishAggregationToCentralPortalSnapshots")
    group = "publishing"
    description = "Shortcut for publishAggregationToCentralPortalSnapshots"
}

tasks.register("tl") {
    // Call nmcpPublishAggregationToMavenLocal to publish to the maven local
    dependsOn("nmcpPublishAggregationToMavenLocal")
    group = "publishing"
    description = "Shortcut for nmcpPublishAggregationToMavenLocal"
}
