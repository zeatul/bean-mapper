plugins {
    id 'groovy-gradle-plugin'
    id 'java-gradle-plugin'
}

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // Build-only dependency used to parse the version catalog for the BOM projects.
    implementation 'org.apache.groovy:groovy-toml:4.0.29'
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 10, "minutes"
        resolutionStrategy.cacheDynamicVersionsFor 10, "minutes"
    }
}
