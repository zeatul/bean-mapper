plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}


java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }

    // 显式指定兼容性
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    withJavadocJar() //with java doc
    withSourcesJar() //with java source
}

dependencies {
    // 依赖版本统一由 hawk-dependencies-bom（第三方）、hawk-framework-bom（hawk-core）
    // 和 codepoet-bom（javapoet-pro）管理。
    implementation(platform(libs.hawk.dependencies.bom))
    implementation(platform(libs.hawk.framework.bom))
    implementation(platform(libs.codepoet.bom))

    // Also import BOMs for testImplementation to resolve test dependencies from BOMs
//    testImplementation(platform(libs.hawk.dependencies.bom))
//    testImplementation(platform(libs.hawk.framework.bom))
//    testImplementation(platform(libs.codepoet.bom))

    // Test dependencies - versions managed by BOMs
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.assertj:assertj-core"
    testImplementation "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
    options.encoding = 'utf-8'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:-options"
    // options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    // sourceCompatibility = "${JavaVersion.VERSION_1_8}"
    // targetCompatibility = "${JavaVersion.VERSION_1_8}"
}

publishing {
    publications {
        myLibrary(MavenPublication) {
            from components.java
            project.afterEvaluate {
                pom {
                    name = project.name
                    description = project.description
                    url = 'https://github.com/zeatul/bean-mapper'
                    licenses {
                        license {
                            name = 'Apache-2.0'
                            url = 'https://opensource.org/licenses/Apache-2.0'
                        }
                    }
                    developers {
                        developer {
                            name = 'Zhang Peng'
                            email = 'zeatul@qq.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/zeatul/bean-mapper.git'
                        developerConnection = 'scm:git:ssh://github.com/zeatul/bean-mapper.git'
                        url = 'https://github.com/zeatul/bean-mapper.git'
                    }
                }
            }
        }
    }

    // The repository for publications is defined in the init.gradle file.
    repositories {
        mavenLocal()
    }
}

signing {
    required { !version.endsWith("SNAPSHOT") && gradle.taskGraph.hasTask("publish") }

    def signingKey = System.getenv("GPG_PRIVATE_KEY")
    def signingPassword = System.getenv("GPG_PASSPHRASE")

    if (signingKey && signingPassword) {
        // CI：内存密钥，不需要 keyId 和密钥文件
        useInMemoryPgpKeys(signingKey, signingPassword)
    }

    sign publishing.publications.myLibrary
}
