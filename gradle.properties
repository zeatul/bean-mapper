#version=1.3.0-SNAPSHOT
version=1.2.0
group=io.github.zeatul

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en

# Java Toolchains: 自动检测已安装 JDK，缺失时自动下载，兜底读取 JAVA_HOME/
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.fromEnv=JAVA_HOME, JDK8, JDK17, JDK21




